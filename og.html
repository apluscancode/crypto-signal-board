<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@font-face{
  font-family:'Vazirmatn';
  src:url('/root/crypto-dashboard/fonts/Vazirmatn-Regular.woff2') format('woff2');
  font-weight:400;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('/root/crypto-dashboard/fonts/Vazirmatn-Bold.woff2') format('woff2');
  font-weight:700;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#0b0e14;
  font-family:'Vazirmatn',Tahoma,sans-serif;
  color:#e8ecf4;
  position:relative;
  display:flex;flex-direction:column;
  padding:52px 60px;
}
.bg{position:absolute;inset:0;z-index:0}
.bg::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(160deg,#0b0e14 0%,#121722 100%);
}
.bg::after{
  content:'';position:absolute;top:-180px;right:-160px;width:620px;height:620px;
  background:radial-gradient(circle,rgba(0,211,149,.20),transparent 62%);
}
.inner{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.head{display:flex;align-items:center;gap:18px}
.logo{width:62px;height:62px;border-radius:16px;background:#121722;border:4px solid #00d395;display:flex;align-items:center;justify-content:center;flex:none}
h1{font-size:50px;font-weight:700;letter-spacing:-1px;line-height:1.2}
.tag{font-size:25px;color:#9aa6bd;margin-top:4px}
.hr{height:2px;background:#232b3a;margin:26px 0 24px}
.stats{display:flex;gap:22px}
.box{background:#121722;border:2px solid #232b3a;border-radius:18px;padding:16px 22px;flex:1}
.box .lbl{font-size:20px;color:#66718a}
.box .num{font-size:46px;font-weight:700;line-height:1.25;margin-top:2px}
.buy .num{color:#00d395} .hold .num{color:#f5b544} .sell .num{color:#ff4d6d}
.regime .num{color:#e8ecf4}
.strip{
  margin-top:auto;background:#121722;border:2px solid #232b3a;border-radius:18px;
  padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.strip .txt{font-size:24px;font-weight:700}
.pills{display:flex;gap:12px;flex:none}
.pill{border:2px solid;border-radius:12px;padding:9px 22px;font-size:21px;font-weight:700;background:#0b0e14;letter-spacing:.5px}
.pill.b{border-color:#00d395;color:#00d395}
.pill.h{border-color:#f5b544;color:#f5b544}
.pill.s{border-color:#ff4d6d;color:#ff4d6d}
.foot{margin-top:16px;font-size:20px;color:#66718a;direction:ltr;text-align:right}
</style>
</head>
<body>
<div class="bg"></div>
<div class="inner">
  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="40" height="40"><path d="M20 66 L38 40 L54 56 L80 26" stroke="#00d395" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>داشبورد سیگنال ۱۰۰ کوین برتر</h1>
      <div class="tag">ICT · الیوت · ایچیموکو — به‌روزرسانی ساعتی</div>
    </div>
  </div>

  <div class="hr"></div>

  <div class="stats">
    <div class="box buy"><div class="lbl">خرید</div><div class="num" id="b">15</div></div>
    <div class="box hold"><div class="lbl">انتظار</div><div class="num" id="h">70</div></div>
    <div class="box sell"><div class="lbl">فروش</div><div class="num" id="s">15</div></div>
    <div class="box regime"><div class="lbl">رژیم بازار</div><div class="num" id="r">نزولی</div></div>
  </div>

  <div class="strip">
    <div class="txt">حکم خرید و فروش برای ۱۰۰ کوین برتر — بدون سرور، بدون هزینه</div>
    <div class="pills">
      <div class="pill b">BUY</div>
      <div class="pill h">HOLD</div>
      <div class="pill s">SELL</div>
    </div>
  </div>

  <div class="foot">apluscancode.github.io/crypto-signal-board</div>
</div>
<script>
fetch('data/signals.json').then(r=>r.json()).then(d=>{
  document.getElementById('b').textContent=d.buy;
  document.getElementById('h').textContent=d.hold;
  document.getElementById('s').textContent=d.sell;
  document.getElementById('r').textContent=d.regime_fa||'—';
}).catch(()=>{});
</script>
</body>
</html>
